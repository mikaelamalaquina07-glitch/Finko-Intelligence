<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Finko Intelligence</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf9f6;
      color: #1c1f1a;
      padding: 60px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitulo {
      font-size: 20px;
      margin-bottom: 40px;
    }

    .propiedad {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #dedad2;
      border-radius: 10px;
      max-width: 500px;
      background: white;
    }

    .estado {
      color: #555;
    }

    .error {
      color: #a12622;
    }

    #mensaje {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Finko Intelligence</h1>

  <p class="subtitulo">
    Sistema inteligente para analizar el rendimiento de propiedades publicadas en Instagram.
  </p>

  <h2>Propiedades guardadas en Supabase</h2>

  <div id="mensaje">Cargando...</div>

  <div id="propiedades"></div>

  <script>
    async function cargarPropiedades() {
      const mensaje = document.getElementById("mensaje");
      const contenedor = document.getElementById("propiedades");

      try {
        const respuesta = await fetch("/api/propiedades");
        const resultado = await respuesta.json();

        if (!respuesta.ok) {
          throw new Error(resultado.error || "No se pudieron cargar las propiedades.");
        }

        if (resultado.data.length === 0) {
          mensaje.textContent = "Todavía no hay propiedades guardadas.";
          return;
        }

        mensaje.textContent = "";
        resultado.data.forEach((propiedad) => {
          const tarjeta = document.createElement("div");
          tarjeta.className = "propiedad";

          const nombre = document.createElement("h3");
          nombre.textContent = propiedad.nombre || "Propiedad sin nombre";

          const estado = document.createElement("p");
          estado.className = "estado";
          estado.textContent = `Estado: ${propiedad.estado || "Sin estado"}`;

          tarjeta.append(nombre, estado);
          contenedor.appendChild(tarjeta);
        });
      } catch (error) {
        mensaje.className = "error";
        mensaje.textContent = "No se pudieron cargar las propiedades. Revisa la configuración de Supabase.";
        console.error("Error cargando propiedades:", error);
      }
    }

    cargarPropiedades();
  </script>

</body>
</html>
