<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Finko Intelligence</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #faf9f6;
      color: #1c1f1a;
      padding: 60px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .subtitulo {
      font-size: 20px;
      margin-bottom: 40px;
    }

    .propiedad {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #dedad2;
      border-radius: 10px;
      max-width: 500px;
      background: white;
    }

    .estado {
      color: #555;
    }

    #mensaje {
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Finko Intelligence</h1>

  <p class="subtitulo">
    Sistema inteligente para analizar el rendimiento de propiedades publicadas en Instagram.
  </p>

  <h2>Propiedades guardadas en Supabase</h2>

  <div id="mensaje">Cargando...</div>

  <div id="propiedades"></div>

  <script>
    const SUPABASE_URL = "NEXT_PUBLIC_SUPABASE_URL=https://ogjptusnafdejnvdozln.supabase.co
";
    const SUPABASE_KEY = "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_oyQyB4_awZjGZZkpwA-qHg_75GHfZfQ";

    const clienteSupabase = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function cargarPropiedades() {

      const { data, error } = await clienteSupabase
        .from("propiedades")
        .select("*");

      const mensaje = document.getElementById("mensaje");
      const contenedor = document.getElementById("propiedades");

      if (error) {
        mensaje.textContent = "Error al cargar propiedades.";
        console.error(error);
        return;
      }

      mensaje.textContent = "";

      data.forEach(propiedad => {

        const tarjeta = document.createElement("div");

        tarjeta.className = "propiedad";

        tarjeta.innerHTML = `
          <h3>${propiedad.nombre}</h3>
          <p class="estado">Estado: ${propiedad.estado}</p>
        `;

        contenedor.appendChild(tarjeta);

      });
    }

    cargarPropiedades();
  </script>

</body>
</html>
