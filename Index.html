<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finko Intelligence</title>
<style>
  :root {
    --bg: #0F1720;
    --panel: #141F2B;
    --border: #23303D;
    --text-primary: #E9EEF3;
    --text-secondary: #93A4B4;
    --accent: #4FD1A5;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  body {
    background-color: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: 560px;
    background-color: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 48px 40px;
  }

  .mark {
    width: 40px;
    height: 40px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #2E9E7C);
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 18px;
    color: #0F1720;
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.3;
    margin-bottom: 14px;
  }

  p.subtitle {
    font-size: 16px;
    line-height: 1.6;
    color: var(--text-secondary);
    max-width: 46ch;
  }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 32px 0;
  }

  p.status {
    font-size: 14px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--accent);
    flex-shrink: 0;
  }
</style>
</head>
<body>
<main>
  <div class="mark">Fi</div>
  <h1>Finko Intelligence</h1>
  <p class="subtitle">Sistema inteligente para analizar el rendimiento de propiedades publicadas en Instagram.</p>
  <hr>
  <p class="status"><span class="dot"></span>Prueba inicial del frontend.</p>
</main>
</body>
</html>
